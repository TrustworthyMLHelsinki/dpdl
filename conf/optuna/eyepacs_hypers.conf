# Optuna search space for the EyePACS HPO tutorial 

batch_size:
  type: categorical
  options:
    - 64
    - 128
    - 256
    - 512
    - 1024

learning_rate:
  type: float
  min: 1.0e-5
  max: 1.0e-2
  log_space: True

epochs:
  type: int
  min: 1
  max: 8

# `max_grad_norm` (the DP-SGD clipping bound) has a natural order, 
# so we use the `ordered` type instead of `categorical` here.
# Optuna can exploit the fact that 1.0 is "between" 0.5 and 2.0, which speeds up the search.
# See the hyperparameter documentation (docs/hyperparameter-optimization.md) for more details.
max_grad_norm:
  type: ordered
  options:
    - 0.1
    - 0.5
    - 1.0
    - 2.0
    - 5.0
    - 10.0
