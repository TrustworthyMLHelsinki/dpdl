[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dpdl"
version = "0.1.0"
description = "Framework for differentially private deep learning experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "torchvision",
  "timm",
  "datasets",
  "transformers",
  "huggingface_hub",
  "safetensors",
  "peft",
  "optuna",
  "optuna-integration",
  "botorch",
  "torchmetrics",
  "pydantic",
  "typer",
  "multiprocess",
  "numpy",
  "pandas",
  "PyYAML",
  "Pillow",
  "opacus>=1.6.0",
  "pandas-stubs~=2.3.3",
  "ipykernel>=7.3.0",
  "matplotlib>=3.10.9",
  "wandb>=0.28.2",
  "weave>=0.53.6",
]

[project.scripts]
dpdl = "run:main"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-xdist",
]

[tool.setuptools]
py-modules = ["run"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dpdl*"]

[tool.uv.sources]
opacus = { git = "ssh://git@github.com/DPBayes/opacus.git", rev = "69725022706c092c0afeef1af2d858827ee78c20" }
